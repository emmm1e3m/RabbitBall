  <style>
    :root { color-scheme: light; --ink:#594654; --muted:#9b8792; --pink:#ed6b9c; --deep-pink:#d94c83; --line:rgba(147,104,126,.13); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { color:var(--ink); background:#fbf7f8; font-family:var(--rabbit-font); -webkit-font-smoothing:antialiased; }
    button { font:inherit; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:3px solid #e895b6; outline-offset:5px; }
    button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; }
    .icon-defs { position:absolute; width:0; height:0; overflow:hidden; }
    .app { min-height:720px; height:100svh; display:flex; flex-direction:column; overflow:hidden; position:relative; isolation:isolate; background:radial-gradient(ellipse at 50% 48%,#ffedf3 0,rgba(255,241,246,.7) 23%,transparent 60%),linear-gradient(135deg,#fcfaf7,#fbf7fa 66%,#f8f5fc); }
    .app::before { content:""; position:absolute; inset:0; pointer-events:none; z-index:-1; opacity:.24; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23987d89' opacity='.13' filter='url(%23n)' d='M0 0h160v160H0z'/%3E%3C/svg%3E"); }
    .header { flex:0 0 auto; padding:28px 38px 10px; display:flex; align-items:center; justify-content:space-between; gap:20px; position:relative; z-index:5; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:35px; height:39px; overflow:visible; }
    .brand-name { font-size:20px; font-weight:600; letter-spacing:-.5px; }
    .brand-note { font-size:13px; letter-spacing:2.4px; color:var(--muted); margin-top:4px; }
    .header-actions { display:flex; gap:9px; align-items:center; }
    .auto-button,.pause-button { color:#88717e; background:rgba(255,255,255,.63); border:1px solid rgba(225,206,217,.65); height:39px; border-radius:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .25s,color .25s,box-shadow .25s; }
    .auto-button { gap:7px; padding:0 15px; font-size:14px; }
    .auto-button svg { width:15px; height:15px; }
    .auto-button[aria-pressed="true"] { background:#f8e2ec; color:var(--deep-pink); border-color:#f0c5d7; }
    .pause-button { width:39px; }
    .pause-button svg { width:16px; height:16px; }
    .auto-button:hover,.pause-button:hover { background:#fff; box-shadow:0 4px 16px #a6658410; }
    .scene { flex:1; min-height:570px; position:relative; touch-action:auto; }
    .intro { position:absolute; top:32px; left:20px; right:20px; text-align:center; pointer-events:none; z-index:3; transition:opacity .24s,transform .32s; }
    .app.chat-open .intro { opacity:0;transform:translateY(-8px); }
    .app.chat-open .pet-caption { opacity:0; }
    .eyebrow { display:flex; align-items:center; justify-content:center; gap:8px; color:#aa8295; font-size:13px; letter-spacing:3px; margin:0 0 13px; }
    .eyebrow::before,.eyebrow::after { content:""; width:18px; height:1px; background:#d6b9c6; }
    .intro h1 { font-size:calc(clamp(25px,3.15vw,39px) + 2px); font-weight:500; line-height:1.4; letter-spacing:1px; margin:0; transition:opacity .17s,transform .25s; }
    .intro p { font-size:15px; line-height:1.8; color:var(--muted); margin:11px 0 0; transition:opacity .17s,transform .25s; }
    .intro.changing h1,.intro.changing p { opacity:0; transform:translateY(5px); }
    .atmosphere { position:absolute; inset:12% 10% 21%; pointer-events:none; }
    .halo { width:min(64vw,670px); aspect-ratio:1; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle,rgba(250,201,222,.19),rgba(255,235,242,.12) 43%,transparent 71%); }
    .orbit { width:min(74vw,700px); height:min(39vw,350px); position:absolute; left:50%; top:57%; transform:translate(-50%,-50%) rotate(-17deg); border:1px solid rgba(222,190,207,.19); border-radius:50%; }
    .orbit::after { content:""; position:absolute; inset:25px -25px; border:1px solid rgba(222,190,207,.08); border-radius:50%; transform:rotate(34deg); }
    .dust { position:absolute; width:4px; height:4px; border-radius:50%; background:#deb8cb; opacity:.42; }
    .dust:nth-of-type(3) { left:24%; top:28%; }
    .dust:nth-of-type(4) { left:76%; top:32%; width:3px; height:3px; }
    .dust:nth-of-type(5) { left:69%; top:77%; }
    .dust:nth-of-type(6) { left:32%; top:75%; width:2px; height:2px; }
    .tiny-star { position:absolute; width:11px; height:11px; color:#d9bacb; opacity:.64; }
    .tiny-star.one { left:28%; top:42%; }
    .tiny-star.two { right:28%; top:57%; width:7px; height:7px; }
    .pet { position:absolute; top:0; left:0; padding:0; border:0; margin:0; background:none; width:360px; height:400px; transform-origin:0 0; will-change:transform; touch-action:manipulation; cursor:pointer; z-index:4; user-select:none; -webkit-user-select:none; }
    .pet:focus-visible { outline:none; }
    .pet:focus-visible::after { content:""; position:absolute; inset:27% 8% 3%; border:2px dashed #d98dae; border-radius:50%; }
    .pet .rabbit-svg { display:block; width:100%; height:100%; overflow:visible; pointer-events:none; stroke:none; }
    .pet .effects { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; stroke:none; }
    .is-graph-open #pet { z-index:26; }
    .is-graph-open .intro,.is-graph-open .caption,.is-graph-open .scan-card { visibility:hidden; }
    .pet .jelly-aura { position:absolute; inset:22% 4% -2%; z-index:-1; background:radial-gradient(ellipse,rgba(239,134,180,.13),transparent 69%); transform:scale(1.12); pointer-events:none; }
    .pet.can-drag { cursor:grab;touch-action:none; }
    .pet.is-dragging { cursor:grabbing; }
    .scan-card { position:absolute; left:0; top:0; width:142px; padding:16px 15px; background:linear-gradient(145deg,#fff,#fff9fc); border:1px solid #f1dfe8; border-radius:17px; box-shadow:0 14px 38px #b7759414,0 2px 6px #b7759407; pointer-events:none; opacity:0; will-change:transform,opacity; z-index:2; overflow:hidden; }
    .paper-heading { display:flex; align-items:center; gap:6px; color:#b9819c; font-size:12px; letter-spacing:.6px; }
    .paper-dot { width:5px; height:5px; border-radius:50%; background:#eb9bbc; }
    .paper-flower { width:65px; height:65px; display:block; margin:12px auto 10px; }
    .paper-title { color:#8e6a7d; font-size:14px; text-align:center; letter-spacing:1px; }
    .paper-line { height:3px; background:#f0e4ea; border-radius:2px; margin:9px auto 0; width:89%; }
    .paper-line.short { width:60%; margin-top:6px; }
    .scan-sweep { position:absolute; left:0; right:0; top:0; height:33px; background:linear-gradient(0deg,#f28ab529,transparent); border-bottom:1px solid #e9a5c2; }
    .scan-corners { position:absolute; inset:7px; border-radius:11px; border:1px solid #e4a1bf; opacity:.55; }
    .pet-caption { position:absolute; left:50%; bottom:146px; transform:translateX(-50%); font-size:13px; letter-spacing:1px; color:#b08a9e; display:flex; gap:7px; align-items:center; white-space:nowrap; pointer-events:none; }
    .pet-caption::before { content:""; width:4px; height:4px; background:#d4a3ba; border-radius:50%; }
    .mode-dock { position:absolute; bottom:36px; left:50%; transform:translateX(-50%); display:flex; padding:7px; gap:3px; border:1px solid rgba(236,218,228,.85); border-radius:25px; background:rgba(255,255,255,.82); box-shadow:0 12px 42px #9a647c0a,0 2px 6px #9a647c05; z-index:6; }
    .mode-button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; border:0; background:none; color:#a18b97; width:77px; height:69px; border-radius:18px; cursor:pointer; transition:color .25s,background .25s,transform .3s; position:relative; }
    .mode-button span { font-size:13px; letter-spacing:.5px; }
    .mode-button svg { width:22px; height:22px; transition:transform .35s; }
    .mode-button:hover { background:#fbf3f7; color:#d7779e; }
    .mode-button:hover svg { transform:translateY(-2px); }
    .mode-button[aria-pressed="true"] { background:#f8e7ef; color:#d35c8a; }
    .mode-button[aria-pressed="true"]::after { content:""; position:absolute; width:3px; height:3px; border-radius:50%; bottom:5px; background:#e188ac; }
    .footer { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 39px 24px; color:#b9a3af; font-size:12px; letter-spacing:.6px; gap:18px; }
    .footer .gesture { display:flex; align-items:center; gap:8px; }
    .footer svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.5; }
    .footer .separator { opacity:.5; padding:0 4px; }
    .footer kbd { font:inherit; letter-spacing:1px; padding:2px 5px; border:1px solid #e8dbe2; border-radius:4px; background:#ffffff55; }
    @media(min-width:1600px) { .intro { top:45px; } .mode-dock { bottom:55px; } .pet-caption { bottom:165px; } }
    @media(max-width:620px) {
      .app { min-height:680px; } .header { padding:22px 20px 8px; } .brand { gap:9px; } .brand-name { font-size:18px; } .brand-mark { width:29px; height:34px; } .brand-note { font-size:11px; letter-spacing:1.8px; }
      .auto-button { height:35px; padding:0 11px; font-size:13px; } .pause-button { width:35px; height:35px; } .header-actions { gap:7px; }
      .intro { top:27px; } .intro p { font-size:14px; margin-top:8px; } .eyebrow { font-size:11px; margin-bottom:12px; }
      .scene { min-height:550px; } .mode-dock { gap:1px; padding:6px; border-radius:22px; bottom:37px; } .mode-button { width:45px; height:63px; border-radius:15px; gap:7px; } .mode-button span { font-size:12px; letter-spacing:0; } .mode-button svg { width:20px; height:20px; }
      .pet-caption { font-size:12px; bottom:139px; } .footer { padding:0 21px 20px; font-size:11px; justify-content:center; } .footer .keyboard { display:none; } .scan-card { width:114px; padding:12px 10px; } .paper-flower { width:53px; height:53px; } .paper-title { font-size:12px; } .paper-heading { font-size:10px; }
      .orbit { width:90vw; height:48vw; } .tiny-star.one { left:13%; } .tiny-star.two { right:12%; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; } }
    .intro,.atmosphere,.mode-dock,.footer,.pet-caption,.pause-button { display:none; }
    .app { min-height:640px; }
    .scene { min-height:0; }
    html.desktop-mode,html.desktop-mode body,html.desktop-mode .app { background:transparent!important;min-height:0; }
    html.desktop-mode .app { height:100vh; }
    html.desktop-mode .app::before,html.desktop-mode .header { display:none!important; }
    html.desktop-mode .scene { height:100vh;min-height:0; }
    html.desktop-mode .rs-backdrop { background:transparent!important; }
  </style>
</head>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const scene=$('scene'), pet=$('pet'), art=$('rabbit-art');
    const desktop=!!window.rabbitDesktop;
    if(desktop)document.documentElement.classList.add('desktop-mode');
    const title=$('mode-title'), hint=$('mode-hint'), intro=$('intro'), caption=$('caption');
